server {

  include /etc/nginx/conf.d/external/common.conf;

  index index.html index.htm index.php;

  include /etc/nginx/conf.d/unit/external.conf;
  include /etc/nginx/conf.d/rewrite/thinkphp.conf;

  location ~ \.php {
    fastcgi_pass {{FASTCGI}};
    fastcgi_index index.php;
    include /etc/nginx/conf.d/unit/fastcgi.conf;
    set $real_script_name $fastcgi_script_name;
    if ($fastcgi_script_name ~ "^(.+?\.php)(/.+)$") {
      set $real_script_name $1;
      set $path_info $2;
    }
    fastcgi_param SCRIPT_FILENAME $document_root$real_script_name;
    fastcgi_param SCRIPT_NAME $real_script_name;
    fastcgi_param PATH_INFO $path_info;
  }

  include /etc/nginx/conf.d/unit/deny.conf;
  include /etc/nginx/conf.d/unit/cache_file.conf;
  
}
