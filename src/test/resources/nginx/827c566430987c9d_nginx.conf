worker_processes 1;

events { worker_connections 1024; }

http {
    include mime.types;
    sendfile on;
    server {
        server_name localhost;
        listen 8080;

        location / {
            set $ingress_name "";
            if ($http_x_ingress_name ~ 'airflow-ingress' ){
               set $ingress_name airflow;
            }
            if ($http_x_code){
               set $ingress_name "${ingress_name}${http_x_code}";
            }
            if ($ingress_name = airflow403){ return 403; }
            if ($ingress_name = airflow404){ return 404; }
            if ($ingress_name = airflow502){ return 502; }
            if ($ingress_name = airflow503){ return 503; }
            return 404;
        }

        error_page 403 /403.html;
        location /403.html {
            root /opt/app-root/src;
            allow all;
        }

        error_page 404 /404.html;
        location /404.html {
            root /opt/app-root/src;
            allow all;
        }

        error_page 502 /502.html;
        location /502.html {
            root /opt/app-root/src;
            allow all;
        }

        error_page 503 /503.html;
        location /503.html {
            root /opt/app-root/src;
            allow all;
        }

        location /healthz {
            return 200;
        }
    }
}
