#daemon off;
user root;
#user  nobody;

#error_log 级别分为 debug, info, notice, warn, error, crit  默认为crit, 该级别在日志名后边定义格式如下：
#error_log  /your/path/error.log crit;
#crit 记录的日志最少，而debug记录的日志最多。

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

error_log  logs/error.log  debug;
#error_log  logs/error.log  error;


pid        logs/nginx.pid;

worker_processes auto;
worker_cpu_affinity auto;
#worker_rlimit_nofile 102400;
worker_rlimit_nofile 65535;

events {
  #worker_connections 102400;
  worker_connections 65535;
  #  reuse_port on;
}





http {

  charset utf-8;

  #通常用来注册lua的全局变量或在服务器启动时预加载lua模块：
  lua_shared_dict persistent_storage 64m;

  lua_shared_dict dogs 1m;

  init_by_lua_block {

    -- 日志输出无效
    print("/init_by_lua_block*")

    cjson = require "cjson"

    local dogs = ngx.shared.dogs;
    dogs:set("Tom", 50)


    -- use resty.core for performance improvement, see the status note above
    -- 使用resty.core进行性能改进，请参阅上面的状态说明

    require "resty.core"

    -- require the base module 非全局变量，在 server 不生效
    local lua_resty_waf = require "resty.waf"

    -- perform some preloading and optimization
    -- 执行一些预加载和优化

    lua_resty_waf:set_option("debug", true)
    lua_resty_waf:set_option("mode", "ACTIVE")



    lua_resty_waf.init()
  }

  server {

    location / {

      #访问/跳转到/inde.xhtml,access_by_lua_block会被访问两次 ;/mixed 不会
      access_by_lua_block {
        ngx.log(ngx.ERR, "/access_by_lua_block*")

        local lua_resty_waf = require "resty.waf"

        local waf = lua_resty_waf:new()

        -- define options that will be inherited across all scopes
        -- 定义将在所有范围内继承的选项
        waf:set_option("debug", true)
        waf:set_option("mode", "ACTIVE")

        -- 这对于低流量或测试站点可能是理想的
        -- 默认情况下，在缓冲区已满之前不会写入事件日志
        -- 进行测试，每5秒刷新一次日志缓冲区
        -- this may be desirable for low-traffic or testing sites
        -- by default, event logs are not written until the buffer is full
        -- for testing, flush the log buffer every 5 seconds
        --
        -- this is only necessary when configuring a remote TCP/UDP
        -- socket server for event logs. otherwise, this is ignored


        local deny_override = function(waf, ctx)
            ngx.log(ngx.INFO, "Overriding DENY action")

            -- write the log events ourself, if we have an error_page 403 defined
            -- note that we define two params 'true' and 'ctx', which use the existing
            -- waf object instead of re-fetching from ngx.ctx
            waf:write_log_events(true, ctx)

            -- exit with a 403
            ngx.exit(ngx.HTTP_FORBIDDEN)
        end
        -- override the DENY action with the function defined above
        waf:set_option("hook_action", "DENY", deny_override)


        waf:set_option("event_log_periodic_flush", 5)
        waf:set_option("storage_zone", "persistent_storage")
        waf:set_option("event_log_request_body", true)

        -- 加载规则
        waf:set_option("add_ruleset", "11000_whitelist")
        waf:set_option("add_ruleset", "20000_http_violation")
        waf:set_option("add_ruleset", "21000_http_anomaly")
        waf:set_option("add_ruleset", "35000_user_agent")
        waf:set_option("add_ruleset", "40000_generic_attack")
        waf:set_option("add_ruleset", "41000_sqli")
        waf:set_option("add_ruleset", "42000_xss")
        waf:set_option("add_ruleset", "90000_custom")
        waf:set_option("add_ruleset", "99000_scoring")

        ngx.log(ngx.ERR, "规则加载完成*")


        -- run the firewall
        waf:exec()
      }

      header_filter_by_lua_block {
        ngx.log(ngx.ERR, "/header_filter_by_lua_block*")

        local lua_resty_waf = require "resty.waf"

        -- 请注意在先前处理程序中设置的选项（在相同范围内）
        -- 不需要再次设置
        -- note that options set in previous handlers (in the same scope)
        -- do not need to be set again
        local waf = lua_resty_waf:new()

        waf:exec()
      }

      body_filter_by_lua_block {
        ngx.log(ngx.ERR, "/body_filter_by_lua_block*")

        local lua_resty_waf = require "resty.waf"

        local waf = lua_resty_waf:new()

        waf:exec()
      }

      log_by_lua_block {
        ngx.log(ngx.ERR, "/log_by_lua_block*")

        local lua_resty_waf = require "resty.waf"

        local waf = lua_resty_waf:new()

        waf:exec()
      }
    }





    ### set_by_lua*: 流程分支处理判断变量初始化
    ### rewrite_by_lua*: 转发、重定向、缓存等功能(例如特定请求代理到外网)
    ### access_by_lua*: IP 准入、接口权限等情况集中处理(例如配合 iptable 完成简单防火墙)
    ### content_by_lua*: 内容生成
    ### header_filter_by_lua*: 响应头部过滤处理(例如添加头部信息)
    ### body_filter_by_lua*: 响应体过滤处理(例如完成应答内容统一成大写)
    ### log_by_lua*: 会话完成后本地异步完成日志记录(日志可以记录在本地，还可以同步到其他机器)

    # 加密协议版本
    ###location /mixed {
    ###  access_by_lua_file ...;        # 请求加密解码
    ###  content_by_lua_file ...;       # 请求处理，不需要关心通信协议
    ###  body_filter_by_lua_file ...;   # 应答加密编码
    ###}

    location /mixed {
      set_by_lua_block $a {
        ngx.log(ngx.ERR, "set_by_lua*")
      }
      rewrite_by_lua_block {
        ngx.log(ngx.ERR, "rewrite_by_lua*")
      }


      access_by_lua_block {
        ngx.log(ngx.ERR, "access_by_lua*")
      }
      content_by_lua_block {
        ngx.log(ngx.ERR, "content_by_lua*")
      }
      header_filter_by_lua_block {
        ngx.log(ngx.ERR, "header_filter_by_lua*")
      }
      body_filter_by_lua_block {
        ngx.log(ngx.ERR, "body_filter_by_lua*")
      }


      log_by_lua_block {
        ngx.log(ngx.ERR, "log_by_lua*")
      }
    }

    ###不同阶段共享变量
    location /test_var {
      #变量赋值
      rewrite_by_lua_block {
        ngx.ctx.foo = 76
      }
      #变量共享
      access_by_lua_block {
        ngx.ctx.foo = ngx.ctx.foo + 3
      }
      #内容输出
      content_by_lua_block {
        ngx.say(ngx.ctx.foo)

        local dogs = ngx.shared.dogs;
        ngx.say(dogs:get("Tom"))
      }
    }


    #测试
    location /hello {
      default_type text/html;

      access_by_lua_block {
        ngx.log(ngx.ERR, "/hello*")
      }
      content_by_lua_block {
        ngx.log(ngx.ERR, "/content_by_lua_block*")


        ngx.say("<p>hello, world</p>")
        ngx.say("<p>世界，你好</p>")

        -- 测试 cjson 预加载
        ngx.say(cjson.encode({dog = 5, cat = 6}))

      }
    }


  }
}