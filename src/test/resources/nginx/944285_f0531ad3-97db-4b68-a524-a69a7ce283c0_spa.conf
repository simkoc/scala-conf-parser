server {

  include /etc/nginx/conf.d/external/common.conf;

  index index.html index.htm;

  include /etc/nginx/conf.d/unit/external.conf;

  #error_page 404 /404.html;
  #error_page 502 /502.html;

  location / {
    try_files $uri /index.html;
    index  index.html index.htm;
  }
  location /index.html {
    add_header X-Frame-Options {{XFrameOptions}};
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  include /etc/nginx/conf.d/unit/deny.conf;
  include /etc/nginx/conf.d/unit/cache_file.conf;
  
}