lua_package_path '/usr/local/openresty/site/lualib/resty/?.lua;;';

resolver 1.1.1.1;

lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
lua_ssl_verify_depth 5;

# cache for discovery metadata documents
lua_shared_dict discovery 1m;
# cache for JWKs
lua_shared_dict jwks 1m;

server {
  listen 8080;

  set_by_lua $bucket 'return os.getenv("AWS_S3_BUCKET")';
  set_by_lua $region 'return os.getenv("AWS_S3_REGION")';
  set $s3_host $bucket.s3-$region.amazonaws.com;

  location /favicon.ico {
    return 404;
  }

  location / {

    access_by_lua_block {

        local opts = {
           redirect_uri_path = os.getenv("OIDC_REDIRECT_URI_PATH") or "/redirect_uri",
           discovery = os.getenv("OIDC_DISCOVERY"),
           client_id = os.getenv("OIDC_CLIENT_ID"),
           client_secret = os.getenv("OIDC_CLIENT_SECRET"),
           token_endpoint_auth_method = os.getenv("OIDC_AUTH_METHOD") or "client_secret_basic",
           scope = os.getenv("OIDC_AUTH_SCOPE") or "openid email",
           iat_slack = 600,
           authorization_params = { organization_domain="jobteaser" },
        }

        -- call authenticate for OpenID Connect user authentication
        local res, err, _target, session = require("resty.openidc").authenticate(opts)

        ngx.log(ngx.INFO, tostring(res))
        ngx.log(ngx.INFO, tostring(err))

        ngx.log(ngx.INFO,
          "session.present=", session.present,
          ", session.data.id_token=", session.data.id_token ~= nil,
          ", session.data.authenticated=", session.data.authenticated,
          ", opts.force_reauthorize=", opts.force_reauthorize,
          ", opts.renew_access_token_on_expiry=", opts.renew_access_token_on_expiry,
          ", try_to_renew=", try_to_renew,
          ", token_expired=", token_expired
        )

        if err then
          ngx.status = 500
          ngx.say(err)
          ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
        end

        local domains = os.getenv("ACL_EMAIL_DOMAINS")
        if domains and domains ~= "" then
          if not ngx.re.match(opts.scope, "email") then
            ngx.log(ngx.WARN, "You ask for email domains filtering without asking for email scope")
          else
            local domain = res.user.email:sub(res.user.email:find("[^%@]+$"), #res.user.email)

            local domains_hash = {}
            for d in string.gmatch(domains, '([^,]+)') do
              domains_hash[d] = true
            end

            if not domains_hash[domain] then
              ngx.exit(ngx.HTTP_FORBIDDEN)
            end
          end
        end

        require("resty.aws-signature").s3_set_headers(ngx.var.s3_host, ngx.var.uri)
    }

    proxy_http_version 1.1;
    proxy_pass https://$s3_host;
  }
}
