pid /var/run/nginx.pid;
error_log /var/log/nginx/nginx_error.log;
worker_processes 4;

events {
    worker_connections 10240;
}
# for human

http{
    error_log /var/log/nginx/nginx_error.log;
    #    access_log /var/log/nginx/nginx_access.log;
    access_log off;

    gzip on;
    gzip_proxied any;
    gzip_types *;

    server {
        # here is default server
        
        listen 80 default_server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        server_name kong.qbtrade.org;
        location / {
            proxy_pass http://kong:8000/;
            proxy_set_header Host $host;
        }

        location /nginx-status {
            stub_status on;
        }
    }

    server {
        listen 80;
        server_name kong-admin.qbtrade.org;
        location / {
            proxy_pass http://kong:8001/;
        }
    }

    server {
        listen 80;
        server_name api.qbtrade.org;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;


        location /ws {

            proxy_send_timeout 1h;
            proxy_read_timeout 1h;

            proxy_pass http://backend-go-wsproxy:3000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /v1/ws/ {

            proxy_send_timeout 1h;
            proxy_read_timeout 1h;

            rewrite ^/v1/ws/(.*)$ /$1 break;

            proxy_pass http://v1-ws:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /v1.inside/ws/ {

            proxy_send_timeout 1h;
            proxy_read_timeout 1h;

            rewrite ^/v1.inside/ws/(.*)$ /$1 break;

            proxy_pass http://v1-inside-ws:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location ~ ^/wsv2/(.*)$ {

            proxy_send_timeout 1h;
            proxy_read_timeout 1h;

            rewrite ^/wsv2/(.*)$ /$1 break;

            proxy_pass http://bgo-wsv2:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location / {
            proxy_pass http://kong.default.svc.cluster.local:8000/;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 80;
        server_name kube.qbtrade.org;
        location / {
            proxy_pass http://alihk-master.qbtrade.org:8080/;
        }
    }

    server {
        listen 80;
        server_name influx-ui.qbtrade.org;
        location / {
            proxy_pass http://alihk-db-0.qbtrade.org:8083/;
        }
    }

    server {
        listen 80;
        server_name influxdb.qbtrade.org;
        location / {
            proxy_pass http://alihk-db-0.qbtrade.org:8086/;
        }
    }

    server {
        listen 80;
        server_name jenkins.qbtrade.org;

        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        location / {
            proxy_pass http://alihk-jenkins.qbtrade.org:8080/;
        }
    }

    upstream es-backend{
        server alihk-db-2.qbtrade.org:9200;
        server alihk-db-3.qbtrade.org:9200;
    }

    server {
        listen 80;
        client_max_body_size 20m;
        server_name es.qbtrade.org;

        location / {
            proxy_pass http://es-backend;
        }

        #        location / {
        #            # 这里最后 不加 / 因为加了之后 传输的时候会被encode
        #            # 比如 http://es.qbtrade.org/kube/config/stage%2fsvc%2fkafka 这样的请求会被encode成 http://es.qbtrade.org/kube/config/stage/svc/kafka 然后ES就不认了
        #            proxy_pass http://elasticsearch.default.svc.cluster.local:9200;
        #        }
    }




    server {
        listen 80;
        server_name kibana.qbtrade.org;
        location / {
            proxy_pass http://kibana.default.svc.cluster.local:5601/;
        }
    }

    server {
        listen 80;
        server_name aliyun.qbtrade.org;
        return 301 http://signin.aliyun.com/qbtrade/login.htm;
    }
}

